<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Simplified G Mark optimized for favicon -->
  <g id="g-mark" transform="translate(50, 50)">
    <!-- Upper segment (inverted C shape) - thicker for visibility -->
    <path d="M -20 -15 Q -30 -15 -30 -5 Q -30 5 -20 5 L 0 5" 
          stroke="#000000" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    <!-- Lower segment (bottom curve) -->
    <path d="M 0 10 Q -10 10 -10 20 Q -10 30 0 30" 
          stroke="#000000" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
  </g>
  
  <!-- GATVIA Text - smaller and positioned for favicon -->
  <text x="50" y="80" 
        font-family="Arial, sans-serif" 
        font-size="12" 
        font-weight="900" 
        fill="#000000" 
        text-anchor="middle" 
        letter-spacing="1">GATVIA</text>
</svg>
