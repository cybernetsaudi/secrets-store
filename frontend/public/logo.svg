<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- Stylized G Mark - Larger and more prominent -->
  <g id="g-mark">
    <!-- Upper segment (inverted C shape) -->
    <path d="M 60 40 Q 40 40 40 60 Q 40 80 60 80 L 100 80" 
          stroke="#000000" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
    <!-- Lower segment (bottom curve) -->
    <path d="M 100 100 Q 80 100 80 120 Q 80 140 100 140" 
          stroke="#000000" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
  </g>
  
  <!-- GATVIA Text - Larger and bolder -->
  <text x="200" y="110" 
        font-family="Arial, sans-serif" 
        font-size="56" 
        font-weight="900" 
        fill="#000000" 
        text-anchor="middle" 
        letter-spacing="4">GATVIA</text>
</svg>
