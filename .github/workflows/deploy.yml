name: Build and Deploy Store

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for deployment"
        required: false
        default: "Manual rebuild triggered from admin panel"

jobs:
  build-and-deploy:
    name: Build Next.js and Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "${NEXT_PUBLIC_API_URL}" ]; then
            export NEXT_PUBLIC_API_URL="https://secrets.gatvia.com/api"
          fi
          npm run build

      - name: Setup PHP for Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Bundle PHP vendor for FTPS deploy
        working-directory: backend-php
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install deployment tools
        run: sudo apt-get update && sudo apt-get install -y lftp sshpass rsync

      - name: Validate deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          if [ -z "${SSH_HOST}" ]; then
            echo "Missing GitHub secret: SSH_HOST (use u950050130@145.79.209.14)"
            exit 1
          fi
          if [ -z "${SSH_PASS}" ]; then
            echo "Missing GitHub secret: SSH_PASS"
            exit 1
          fi
          echo "Deploy secrets present."

      - name: Deploy to Hostinger (FTPS from GitHub runners)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_ROOT: ${{ secrets.FTP_REMOTE_ROOT }}
          GITHUB_ACTIONS: "true"
        run: bash .github/scripts/deploy-to-hostinger.sh

      - name: Deployment complete
        run: |
          echo "✅ secrets.gatvia.com deployment complete!"
          echo "Note: GitHub-hosted runners use FTPS (SSH/rsync exit 5 is expected on Hostinger)."
          echo "After first FTPS deploy, run migration once in Hostinger SSH:"
          echo "  php api/scripts/migrate_variant_dimensions.php"
