name: Build and Deploy Store

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for deployment"
        required: false
        default: "Manual rebuild triggered from admin panel"

jobs:
  build-and-deploy:
    name: Build Next.js and Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "${NEXT_PUBLIC_API_URL}" ]; then
            export NEXT_PUBLIC_API_URL="https://secrets.gatvia.com/api"
          fi
          npm run build

      - name: Setup PHP for Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Bundle PHP vendor for FTPS deploy
        working-directory: backend-php
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Resolve FTP connection from secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_REMOTE_ROOT: ${{ secrets.FTP_REMOTE_ROOT }}
        run: |
          DEPLOY_PASS="${FTP_PASS:-${SSH_PASS}}"
          if [ -z "${DEPLOY_PASS}" ]; then
            echo "Missing secret: set FTP_PASS (Hostinger FTP password from hPanel → FTP Accounts)."
            echo "SSH_PASS alone is not used unless FTP_PASS is unset."
            exit 1
          fi
          HOST="${FTP_HOST}"
          USER="${FTP_USER}"
          if [ -z "${HOST}" ] || [ -z "${USER}" ]; then
            if [ -z "${SSH_HOST}" ] || [[ "${SSH_HOST}" != *"@"* ]]; then
              echo "Set SSH_HOST=u950050130@145.79.209.14 or set FTP_HOST + FTP_USER secrets"
              exit 1
            fi
            USER="${SSH_HOST%@*}"
            HOST="${SSH_HOST#*@}"
          fi
          REMOTE="${FTP_REMOTE_ROOT:-domains/secrets.gatvia.com/public_html}"
          echo "::add-mask::${DEPLOY_PASS}"
          echo "FTP_DEPLOY_PASSWORD=${DEPLOY_PASS}" >> "$GITHUB_ENV"
          echo "FTP_HOST=${HOST}" >> "$GITHUB_ENV"
          echo "FTP_USER=${USER}" >> "$GITHUB_ENV"
          echo "FTP_REMOTE_ROOT=${REMOTE}" >> "$GITHUB_ENV"
          if [ -n "${FTP_PASS}" ]; then
            echo "Using FTPS ${USER}@${HOST} → ${REMOTE} (FTP_PASS secret)"
          else
            echo "Using FTPS ${USER}@${HOST} → ${REMOTE} (SSH_PASS fallback — set FTP_PASS if login fails)"
          fi

      - name: Include Apache rules in static export
        run: cp public_html/.htaccess frontend/out/.htaccess

      - name: Deploy frontend (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_DEPLOY_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: frontend/out/
          server-dir: ${{ env.FTP_REMOTE_ROOT }}/
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git*
            **/.DS_Store

      - name: Deploy PHP API (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_DEPLOY_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: backend-php/
          server-dir: ${{ env.FTP_REMOTE_ROOT }}/api/
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git*
            **/.env
            **/.env.*
            **/uploads/**
            **/tests/**
            **/*.md

      - name: Deployment complete
        run: |
          echo "✅ secrets.gatvia.com deployment complete (FTPS)."
          echo "Run DB migration once: Admin → Deploy → Run DB migration"
